# Release validation for VocVoc. Runs on every push to master and on pull requests into master (not on other branches or tags).
#
#   validate : fast checks, no browser   -> `npm test`
#              (JavaScript syntax, manifest, Service Worker precache + VERSION guard, API-key guards,
#               data layer: migration idempotency, archive/restore, backups, recovery copies, rollback)
#   browser  : Chrome regression suite   -> `npm run test:browser`
#              (offline/cold start, update lifecycle, IndexedDB persistence, Gemini errors, accessibility, i18n, large lists)
#
# The app itself has no build step and no runtime dependencies; npm is only used for the test tools (tests/package.json).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (syntax, manifest, Service Worker, data layer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test tools
        working-directory: tests
        run: npm ci

      # Fails when ASSETS or any app-shell file changed but the Service Worker VERSION was not bumped
      # (run `node tools/lock-shell.js` after bumping), among the other checks listed above.
      - name: Run release validation
        run: npm test

  browser:
    name: Browser tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test tools
        working-directory: tests
        run: npm ci

      # GitHub-hosted Ubuntu runners ship Google Chrome; the suite drives it through Playwright.
      # If it is ever missing, fall back to the Chromium that Playwright downloads.
      - name: Find Chrome
        run: |
          echo "PWA_BROWSER_PATH=$(command -v google-chrome || true)" >> "$GITHUB_ENV"
          google-chrome --version || true

      - name: Install Chromium (only when the runner has no Chrome)
        if: env.PWA_BROWSER_PATH == ''
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        shell: bash
        run: npm run test:browser 2>&1 | tee browser-output.txt

      # The job log can only be read when signed in; the run's summary page can be read by anyone.
      # When the suite fails, put its message (the failing check and the last scenario that passed) there.
      - name: Show why the browser tests failed in the job summary
        if: failure()
        shell: bash
        run: |
          [ -f browser-output.txt ] || exit 0
          {
            echo '### Browser tests failed'
            echo
            echo '```'
            grep -v '^PASS' browser-output.txt | grep -vE '^\s+"' | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List the scenarios in the job summary
        if: success()
        run: |
          node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('tests/browser-results.json', 'utf8'));
          const lines = ['### Browser tests: ' + r.passed + ' scenarios passed', '', ...r.results.map(name => '- ' + name)];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "
